name: Generate Release Version

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 2.0.0"
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Stable Upgradeable Release
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDFLARE_PRODUCTS_URL: ${{ secrets.CLOUDFLARE_PRODUCTS_URL }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require stable installer signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/moqarin-alasaar-installer.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Require at least one live price cloud
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" && -z "$CLOUDFLARE_PRODUCTS_URL" && -z "$FIREBASE_DATABASE_URL" ]]; then
            echo "At least one product cloud URL must be configured for a release build." >&2
            exit 1
          fi

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version_name }}" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
          else
            VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION_NAME ($((20000 + GITHUB_RUN_NUMBER)))"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed standalone APK and App Bundle
        run: ./gradlew --no-daemon :market-app:assembleRelease :market-app:bundleRelease

      - name: Verify signed APK identity and size
        shell: bash
        run: |
          APK="market-app/build/outputs/apk/release/market-app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          BYTES=$(stat -c%s "$APK")
          LIMIT=$((100 * 1024 * 1024))
          echo "Release APK size: $BYTES bytes"
          if (( BYTES > LIMIT )); then
            echo "Release APK exceeds 100 MiB quality budget." >&2
            exit 1
          fi

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p dist
          cp market-app/build/outputs/apk/release/market-app-release.apk "dist/moqarin-alasaar-${APP_VERSION_NAME}.apk"
          cp market-app/build/outputs/bundle/release/market-app-release.aab "dist/moqarin-alasaar-${APP_VERSION_NAME}.aab"
          sha256sum dist/* > dist/SHA256SUMS.txt
          {
            echo "### مقارن الأسعار"
            echo "- Package: com.malik05255.supermarket"
            echo "- Version: ${APP_VERSION_NAME} (${APP_VERSION_CODE})"
            echo "- Module: market-app (standalone client)"
            echo "- Signing: stable installer key"
            echo "- Upgrade behavior: installs over any older market-app build signed with the same key"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moqarin-alasaar-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/moqarin-alasaar-${APP_VERSION_NAME}.apk \
            dist/moqarin-alasaar-${APP_VERSION_NAME}.aab \
            dist/SHA256SUMS.txt \
            --title "مقارن الأسعار ${APP_VERSION_NAME}" \
            --generate-notes
