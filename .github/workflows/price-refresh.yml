name: Supermarket Price Refresh

on:
  schedule:
    # Twice daily. Riyadh: approximately 03:17 and 15:17.
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      retailer:
        description: "Optional retailer slug (leave empty for all)"
        required: false
        type: string

concurrency:
  group: supermarket-price-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh prices and replicas
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
      MAX_PAGE_SOURCES_PER_RETAILER: "800"
      MAX_SEED_PRODUCT_LINKS_PER_RETAILER: "600"
      REPLICA_SYNC_LOOKBACK_HOURS: "14"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth

      - name: Verify canonical product matching
        working-directory: cloud/ingest
        run: python -m unittest -v test_product_identity.py

      - name: Check canonical cloud configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase secrets are not configured; refresh is skipped safely."
          fi

      - name: Check Cloudflare D1 configuration
        id: d1
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_D1_DATABASE_NAME" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare D1 secrets are not configured; priority queue and D1 sync are skipped safely."
          fi

      - name: Ensure D1 schema and export priority scans
        if: steps.d1.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p cloud/.generated
          npx --yes wrangler@4 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" \
            --remote --yes --file=cloud/d1.sql
          npx --yes wrangler@4 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" \
            --remote --json \
            --command="SELECT barcode, scan_count, name_ar, name_en, image_url, last_seen_at, last_attempt_at FROM missing_barcodes WHERE status='pending' AND (last_attempt_at IS NULL OR last_attempt_at < datetime('now','-24 hours')) ORDER BY scan_count DESC, last_seen_at DESC LIMIT 250" \
            > cloud/.generated/d1-priority.json

      - name: Persist priority barcode metadata
        if: steps.config.outputs.ready == 'true' && steps.d1.outputs.ready == 'true'
        run: |
          python cloud/ingest/priority_scans.py \
            --input cloud/.generated/d1-priority.json \
            --mark-sql cloud/.generated/d1-priority-mark.sql

      - name: Refresh retailer prices
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=()
          if [[ -n "${{ inputs.retailer }}" ]]; then
            EXTRA+=(--retailer "${{ inputs.retailer }}")
          fi
          python cloud/ingest/refresh_v2.py --mode refresh "${EXTRA[@]}"

      - name: Build replica delta and sync Firebase
        if: steps.config.outputs.ready == 'true'
        run: python cloud/ingest/sync_replicas.py

      - name: Apply changed snapshots to Cloudflare D1
        if: steps.config.outputs.ready == 'true' && steps.d1.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" \
            --remote --yes --file=cloud/.generated/d1-sync.sql

          if [[ -f cloud/.generated/d1-priority-mark.sql ]]; then
            npx --yes wrangler@4 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" \
              --remote --yes --file=cloud/.generated/d1-priority-mark.sql
          fi

          # A queued barcode is resolved only after we actually have a supermarket price/offer.
          npx --yes wrangler@4 d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" \
            --remote --yes \
            --command="UPDATE missing_barcodes SET status='resolved', resolved_at=datetime('now') WHERE status='pending' AND barcode IN (SELECT barcode FROM product_snapshots WHERE json_extract(payload,'$.current_price') IS NOT NULL OR json_array_length(COALESCE(json_extract(payload,'$.offers'), json('[]'))) > 0)"

      - name: Refresh summary
        if: always()
        run: |
          echo "### Supermarket refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Product identity tests: required before refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public sitemap/robots discovery: enabled" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.config.outputs.ready }}" != "true" ]]; then
            echo "- Status: Supabase not configured yet" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Canonical refresh: attempted" >> "$GITHUB_STEP_SUMMARY"
            echo "- Priority unknown scans: imported when D1 is configured" >> "$GITHUB_STEP_SUMMARY"
            echo "- Firebase: synchronized when credentials are present" >> "$GITHUB_STEP_SUMMARY"
            echo "- D1: synchronized when credentials are present" >> "$GITHUB_STEP_SUMMARY"
          fi
