name: Android CI

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-identity-tests:
    name: Product & Discovery Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify product identity and public discovery boundaries
        working-directory: cloud/ingest
        run: python -m unittest -v test_product_identity.py test_refresh_v2.py

  assemble-market:
    name: Assemble Lightweight APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDFLARE_PRODUCTS_URL: ${{ secrets.CLOUDFLARE_PRODUCTS_URL }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Prepare stable installer signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/supermarket-installer.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=stable" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=ephemeral-debug" >> "$GITHUB_ENV"
          fi

      - run: chmod +x gradlew
      - name: Assemble standalone market APK
        run: ./gradlew --no-daemon :market-app:assembleDebug

      - name: Enforce APK size budget
        shell: bash
        run: |
          APK="market-app/build/outputs/apk/debug/market-app-debug.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1048576}")
          echo "APK size: ${MIB} MiB"
          echo "APK_SIZE_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "APK_SIZE_MIB=$MIB" >> "$GITHUB_ENV"
          if (( BYTES > 104857600 )); then
            echo "APK exceeds the 100 MiB quality budget" >&2
            exit 1
          fi

      - name: Prepare install artifact
        shell: bash
        run: |
          mkdir -p dist
          cp market-app/build/outputs/apk/debug/market-app-debug.apk "dist/moqarin-alasaar-${GITHUB_RUN_NUMBER}.apk"
          {
            echo "### مقارن الأسعار — standalone APK"
            echo "- Package: com.malik05255.supermarket"
            echo "- Version code: $((20000 + GITHUB_RUN_NUMBER))"
            echo "- APK size: ${APK_SIZE_MIB} MiB"
            echo "- Signing mode: $SIGNING_MODE"
            if [[ "$SIGNING_MODE" == "stable" ]]; then
              echo "- In-place update: enabled for builds signed with this permanent key"
            else
              echo "- In-place update: requires the permanent signing secrets"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: moqarin-alasaar-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  market-unit-tests:
    name: Market Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :market-app:testDebugUnitTest

  market-lint:
    name: Market Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :market-app:lintDebug
