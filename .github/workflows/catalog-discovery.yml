name: Supermarket Catalog Discovery

on:
  schedule:
    # Weekly broad discovery. Small discovery also runs every 12 hours in price-refresh.yml.
    - cron: "43 1 * * 0"
  workflow_dispatch:
    inputs:
      retailer:
        description: "Optional retailer slug (leave empty for all)"
        required: false
        type: string
      max_pages:
        description: "Maximum new fallback pages per retailer"
        required: false
        default: "500"
        type: string

concurrency:
  group: supermarket-catalog-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover verified GTIN product pages
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: https://lbgcjmsqqhrpceijdqng.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_PAGE_SOURCES_PER_RETAILER: ${{ inputs.max_pages || '500' }}
      MAX_SEED_PRODUCT_LINKS_PER_RETAILER: "1200"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install discovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Verify ingestion safety
        working-directory: cloud/ingest
        run: python -m unittest -v test_common.py test_product_identity.py test_refresh_v2.py

      - name: Check canonical cloud configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; discovery is skipped safely."
          fi

      - name: Discover catalog products
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=()
          if [[ -n "${{ inputs.retailer }}" ]]; then
            EXTRA+=(--retailer "${{ inputs.retailer }}")
          fi
          python cloud/ingest/refresh_v2.py --mode discover \
            --max-pages "$MAX_PAGE_SOURCES_PER_RETAILER" \
            "${EXTRA[@]}"

      - name: Discovery summary
        if: always()
        run: |
          echo "### Catalog discovery" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reads public sitemap declarations from robots.txt automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "- Uses robots-allowed public catalog seed pages when no sitemap is published." >> "$GITHUB_STEP_SUMMARY"
          echo "- Extracts product links from HTML and serialized storefront state." >> "$GITHUB_STEP_SUMMARY"
          echo "- Only pages with an unambiguous valid GTIN are accepted." >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages blocked by robots.txt or without a directly verifiable barcode are skipped." >> "$GITHUB_STEP_SUMMARY"
